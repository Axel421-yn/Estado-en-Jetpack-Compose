name: Android
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Start emulator and test
        run: |
          sdkmanager "system-images;android-29;default;x86_64" "platform-tools" "emulator"
          echo no | avdmanager create avd -n test -k "system-images;android-29;default;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          adb shell input keyevent 82
          ./gradlew connectedDebugAndroidTest
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          adb pull /sdcard/Android/data/com.codelabs.basicstatecodelab/files/evidencias evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            evidence/
            emulator.log
